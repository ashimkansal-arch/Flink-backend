services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: flink-backend:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD_URLENC}@host.docker.internal:${POSTGRES_PORT:-5432}/${POSTGRES_DB}?schema=public
      REDIS_CACHE_URL: redis://redis-cache:6379
      REDIS_QUEUE_URL: redis://redis-queue:6379
      FCM_SERVICE_ACCOUNT_PATH: /app/flink-d34a2-firebase-adminsdk-fbsvc-06579c433d.json
    volumes:
      - ./flink-d34a2-firebase-adminsdk-fbsvc-06579c433d.json:/app/flink-d34a2-firebase-adminsdk-fbsvc-06579c433d.json:ro
    depends_on:
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    networks:
      - flink-net
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: flink-backend:latest
    command: ["node", "dist/queues/worker.js"]
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD_URLENC}@host.docker.internal:${POSTGRES_PORT:-5432}/${POSTGRES_DB}?schema=public
      REDIS_CACHE_URL: redis://redis-cache:6379
      REDIS_QUEUE_URL: redis://redis-queue:6379
      FCM_SERVICE_ACCOUNT_PATH: /app/flink-d34a2-firebase-adminsdk-fbsvc-06579c433d.json
    volumes:
      - ./flink-d34a2-firebase-adminsdk-fbsvc-06579c433d.json:/app/flink-d34a2-firebase-adminsdk-fbsvc-06579c433d.json:ro
    depends_on:
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    networks:
      - flink-net
  redis-cache:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_CACHE_PORT:-6379}:6379"
    volumes:
      - redis-cache-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - flink-net
  redis-queue:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_QUEUE_PORT:-6380}:6379"
    volumes:
      - redis-queue-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - flink-net
volumes:
  redis-cache-data:
  redis-queue-data:
networks:
  flink-net:
    driver: bridge
